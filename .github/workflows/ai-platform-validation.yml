name: AI Platform validation

# Do not cancel an in-flight PR gate. A cancelled Restore/Build is not a code result and
# made the exit gate ambiguous when several commits were pushed in succession.
concurrency:
  group: ai-platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore solution
        run: dotnet restore FVN_REGISTER.sln
      - name: Build solution
        run: dotnet build FVN_REGISTER.sln --configuration Release --no-restore
      - name: Run AI tests
        run: dotnet test Tests/FVN_REGISTER.AI.Tests/FVN_REGISTER.AI.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=ai-tests.trx"
