name: AI SQL Server integration validation

on:
  push:
    branches: [master, "feature/ai-platform-phase1-6"]
    paths:
      - "SQL/AI/**"
      - "FVN_REGISTER.AI.Infrastructure/Persistence/**"
      - "scripts/apply-ai-migrations.sh"
      - ".github/workflows/ai-platform-sql-validation.yml"
  pull_request:
    branches: [master]
    paths:
      - "SQL/AI/**"
      - "FVN_REGISTER.AI.Infrastructure/Persistence/**"
      - "scripts/apply-ai-migrations.sh"
      - ".github/workflows/ai-platform-sql-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations-and-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server 2022
        env:
          SA_PASSWORD: "FvnAi_CI_Strong!Pass2026"
        run: |
          docker run -d --name fvn-ai-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          ready=0
          for i in $(seq 1 60); do
            if docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "IF DB_ID(N'FVN_AI') IS NULL CREATE DATABASE FVN_AI;"

      - name: Apply migrations 001-013 twice and verify checksums
        env:
          SA_PASSWORD: "FvnAi_CI_Strong!Pass2026"
        run: |
          set -euo pipefail
          docker cp SQL/AI fvn-ai-sql:/tmp/SQLAI
          docker cp scripts/apply-ai-migrations.sh fvn-ai-sql:/tmp/apply-ai-migrations.sh
          for pass in 1 2; do
            echo "Migration pass $pass"
            docker exec \
              -e SQLCMD_PATH=/opt/mssql-tools18/bin/sqlcmd \
              -e SQLCMD_SERVER=localhost \
              -e SQLCMD_DATABASE=FVN_AI \
              -e SQLCMD_USER=sa \
              -e SQLCMD_PASSWORD="$SA_PASSWORD" \
              -e MIGRATIONS_DIR=/tmp/SQLAI \
              fvn-ai-sql bash /tmp/apply-ai-migrations.sh
          done

      - name: Verify constraints and checksum ledger
        env:
          SA_PASSWORD: "FvnAi_CI_Strong!Pass2026"
        run: |
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "
          IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiModelReleases') AND name=N'UX_AiModelReleases_OneActive' AND is_unique=1 AND has_filter=1) THROW 52001, 'One-active filtered unique index is missing.', 1;
          IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiExtractions') AND name=N'UX_AiExtractions_Document_SchemaVersion' AND is_unique=1 AND has_filter=1) THROW 52002, 'Extraction uniqueness index is missing.', 1;
          IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiKnowledgeChunks') AND name=N'UX_AiKnowledgeChunks_Tenant_Document_Ordinal' AND is_unique=1) THROW 52003, 'Knowledge chunk ordinal index is missing.', 1;
          IF NOT EXISTS (SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'010_Extraction_Deduplication_And_MigrationLedger' AND Sha256Checksum IS NOT NULL) THROW 52004, 'Migration 010 checksum is missing.', 1;
          IF NOT EXISTS (SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'012_KnowledgeChunkConstraint_And_ChecksumLedger' AND MigrationFileName=N'012_KnowledgeChunkConstraint_And_ChecksumLedger.sql' AND Sha256Checksum IS NOT NULL) THROW 52005, 'Migration 012 ledger checksum is missing.', 1;
          IF NOT EXISTS (SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'013_HRCaseTextColumnSizeRepair' AND Sha256Checksum IS NOT NULL) THROW 52006, 'Migration 013 checksum is missing.', 1;
          "

      - name: Verify duplicate ordinal migration failure on legacy data
        env:
          SA_PASSWORD: "FvnAi_CI_Strong!Pass2026"
        run: |
          set -euo pipefail
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "IF DB_ID(N'FVN_AI_DUPLICATE_TEST') IS NULL CREATE DATABASE FVN_AI_DUPLICATE_TEST;"
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI_DUPLICATE_TEST -Q "
          IF SCHEMA_ID(N'ai') IS NULL EXEC(N'CREATE SCHEMA ai');
          CREATE TABLE ai.AiKnowledgeChunks(TenantCode nvarchar(64) NOT NULL, DocumentId uniqueidentifier NOT NULL, ChunkOrdinal int NOT NULL);
          INSERT ai.AiKnowledgeChunks VALUES(N'ci', '11111111-1111-1111-1111-111111111111', 0),(N'ci', '11111111-1111-1111-1111-111111111111', 0);
          CREATE TABLE ai.AiSchemaMigrations(MigrationId nvarchar(160) NOT NULL PRIMARY KEY, AppliedAtUtc datetimeoffset(7) NOT NULL DEFAULT SYSUTCDATETIME());
          "
          docker cp SQL/AI/012_KnowledgeChunkConstraint_And_ChecksumLedger.sql fvn-ai-sql:/tmp/migration012.sql
          set +e
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI_DUPLICATE_TEST -i /tmp/migration012.sql > /tmp/duplicate-migration.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ] || ! grep -q "Duplicate knowledge chunk ordinals exist" /tmp/duplicate-migration.log; then
            cat /tmp/duplicate-migration.log
            echo "Expected migration 012 to fail clearly for duplicate legacy ordinals."
            exit 1
          fi

      - name: Concurrent SQL lease claims and nonce replay test
        env:
          SA_PASSWORD: "FvnAi_CI_Strong!Pass2026"
        run: |
          set -euo pipefail
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "
          DECLARE @i int=1, @doc uniqueidentifier, @sha nvarchar(64);
          WHILE @i<=12
          BEGIN
            SET @doc=NEWID();
            SET @sha=RIGHT(REPLICATE('0',64)+CONVERT(varchar(8),@i),64);
            INSERT ai.AiDocuments(Id,TenantCode,FileName,Extension,MediaType,Length,Sha256,StorageKey,UploadedBy,ReceivedAtUtc,Status,ModuleCode,SchemaCode,SourceType,SourceReference)
            VALUES(@doc,N'ci-queue',CONCAT(N'ci-',@i,N'.txt'),N'.txt',N'text/plain',1,@sha,CONCAT(N'ci/',@i),N'ci-worker',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-test');
            INSERT ai.AiIngestionJobs(Id,DocumentId,Status,AttemptCount,CreatedAtUtc)
            VALUES(NEWID(),@doc,N'Queued',0,TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'));
            SET @i+=1;
          END;
          "
          for i in $(seq 1 12); do
            (
              docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -h -1 -W -Q "SET NOCOUNT ON; DECLARE @claimed table(JobId uniqueidentifier, DocumentId uniqueidentifier, AttemptCount int, LeaseOwner nvarchar(128), LeaseUntilUtc datetimeoffset(7)); INSERT @claimed EXEC ai.usp_ClaimAiIngestionJob @WorkerId=N'ci-worker-$i', @LeaseSeconds=60; SELECT CONVERT(varchar(36),JobId) FROM @claimed;" > "/tmp/claim-$i.txt"
            ) &
          done
          wait
          claimed=$(cat /tmp/claim-*.txt | grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | sort -u | wc -l | tr -d ' ')
          test "$claimed" -eq 12

          # Race identical nonce inserts: the PK must allow exactly one winner.
          for i in $(seq 1 12); do
            docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -h -1 -W -Q "SET NOCOUNT ON; BEGIN TRY INSERT ai.AiRequestNonces(TenantCode,Nonce,ExpiresAtUtc) VALUES(N'ci-tenant',N'concurrent-replay-test',DATEADD(minute,5,TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'))); SELECT N'ACCEPTED'; END TRY BEGIN CATCH IF ERROR_NUMBER() IN (2601,2627) SELECT N'REPLAY'; ELSE THROW; END CATCH;" > "/tmp/nonce-$i.txt" &
          done
          wait
          accepted=$(grep -h -c 'ACCEPTED' /tmp/nonce-*.txt | awk -F: '{s+=$NF} END{print s+0}')
          replay=$(grep -h -c 'REPLAY' /tmp/nonce-*.txt | awk -F: '{s+=$NF} END{print s+0}')
          test "$accepted" -eq 1
          test "$replay" -eq 11

      - name: Tenant-scoped duplicate-key smoke test
        env:
          SA_PASSWORD: "FvnAi_CI_Strong!Pass2026"
        run: |
          set -euo pipefail
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "
          DECLARE @sha nvarchar(64)=REPLICATE(N'A',64);
          INSERT ai.AiDocuments(Id,TenantCode,FileName,Extension,MediaType,Length,Sha256,StorageKey,UploadedBy,ReceivedAtUtc,Status,ModuleCode,SchemaCode,SourceType,SourceReference)
          VALUES(NEWID(),N'ci-tenant-A',N'a.txt',N'.txt',N'text/plain',1,@sha,N'ci/tenantA',N'ci',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-tenant-test'),
                (NEWID(),N'ci-tenant-B',N'b.txt',N'.txt',N'text/plain',1,@sha,N'ci/tenantB',N'ci',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-tenant-test');
          IF (SELECT COUNT(*) FROM ai.AiDocuments WHERE TenantCode IN(N'ci-tenant-A',N'ci-tenant-B') AND Sha256=@sha)<>2 THROW 52010, 'Tenant-scoped deduplication incorrectly crossed tenant boundaries.', 1;
          BEGIN TRY
            INSERT ai.AiDocuments(Id,TenantCode,FileName,Extension,MediaType,Length,Sha256,StorageKey,UploadedBy,ReceivedAtUtc,Status,ModuleCode,SchemaCode,SourceType,SourceReference)
            VALUES(NEWID(),N'ci-tenant-A',N'a2.txt',N'.txt',N'text/plain',1,@sha,N'ci/tenantA2',N'ci',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-tenant-test');
            THROW 52011, 'Same-tenant duplicate unexpectedly succeeded.', 1;
          END TRY
          BEGIN CATCH
            IF ERROR_NUMBER()=52011 THROW;
            IF ERROR_NUMBER() NOT IN(2601,2627) THROW;
          END CATCH;
          "
